            background: #09090b;

            min-height: 100vh;
        }

        header {
            height: 76px;
            padding: 0 7%;

            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #27272a;
            background: #09090b;
        }

        .brand {
            font-size: 17px;
            font-weight: 650;
            letter-spacing: -0.4px;
        }

        .brand span {
            color: #a1a1aa;

        }

        .download {
            text-decoration: none;
            background: #fafafa;
            color: #09090b;
            padding: 11px 19px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .download:hover {
            background: #d4d4d8;
            transform: translateY(-1px);
        }

            color: #a1a1aa;
            font-size: 14px;
        }

        .viewer {
            width: 100%;
            height: 850px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            overflow: hidden;
        }

        .viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 28px 15px;
            color: #71717a;
            font-size: 12px;
            border-top: 1px solid #27272a;
        }

        footer a {
            color: #a1a1aa;
            text-decoration: none;
        }

        footer a:hover {
            color: white;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 18px;
                height: 65px;
            }

            .brand {
                font-size: 14px;
            }

            .download {
                padding: 9px 12px;
                font-size: 12px;
            }

            main {

            }
